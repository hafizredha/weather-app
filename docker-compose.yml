services:
  # PHP service
  php:
    build: 
      context: .
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
  
  # Web service
  web:
    image: nginx:1.27
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - .docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"